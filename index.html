<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bridgton Road Investments LLC - A concentrated global long-only investment firm">
  <meta http-equiv="Cache-Control" content="max-age=31536000">
  <title>Bridgton Road Investments LLC</title>
  
  <!-- Inline all CSS including font-face for performance -->
  <style>
    @font-face {
      font-family: 'Libre Baskerville';
      font-style: normal;
      font-weight: 400;
      font-display: optional;
      src: local('Libre Baskerville'),
           url(https://fonts.gstatic.com/s/librebaskerville/v14/kmKnZrc3Hgbbcjq75U4uslyuy4kn0qNZaxM.woff2) format('woff2');
    }
    body {
      font-family: Georgia, serif;
      line-height: 1.6;
      font-size: 8px;
      font-weight: 400;
    }
    .fonts-loaded body {
      font-family: 'Libre Baskerville', Georgia, serif;
    }
    .content {
      margin: 60px 20px 20px 100px;
      width: 90%;
      max-width: 500px;
    }
    .title {
      margin-top: 20px;
      margin-bottom: 40px;
      font-size: 1.5em;
      font-weight: bold;
      color: #000000;
    }
    @media (max-width: 767px) {
      .content {
        margin: 30px 10px 10px 10px;
      }
    }
    ::selection {
      background: #36f8a3;
    }
    ::-moz-selection {
      background: #36f8a3;
    }
    .writing-list {
      list-style: none;
      padding-left: 0;
    }
  </style>
</head>

<body>
    <main class="content">
        <h1>
            Bridgton Road Investments LLC is a concentrated global long-only investment firm.
        </h1>
    </main>
    
    <!-- Deferred font loading -->
    <script async>
      window.addEventListener('load', function() {
        if ('fonts' in document) {
          document.fonts.ready.then(function() {
            document.documentElement.className += ' fonts-loaded';
          });
        }
      });
    </script>
</body>
</html>
