<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridgton Road</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Baskerville', serif;
      background: #06402B;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      overflow-x: hidden;
    }
    .company-name {
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border: 1px solid #fff;
      padding: 20px 30px;
    }
    .copyright {
      font-size: 1rem;
    }
    @media (max-width: 600px) {
      .company-name { font-size: 1.5rem; padding: 14px 20px; }
    }
  </style>
</head>
<body>
  <div class="company-name">BRIDGTON ROAD</div>
  <div class="copyright">© 2026 Bridgton Road LLC. All rights reserved.</div>
</body>
</html>
